---
name: Draft a release note

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft_release:
    name: Release Drafter
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          # Full history so that all existing tags are available
          fetch-depth: 0
          persist-credentials: false

      # Release Drafter's version resolver only understands SemVer, so the next
      # CalVer version (YYYY.M.N) is computed by scripts/release.py and passed in.
      - name: 📅 Calculate next CalVer version
        id: calver
        run: |
          version="$(python3 scripts/release.py --next-version)"
          echo "Calculated next CalVer: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Run release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.calver.outputs.version }}
          token: ${{ github.token }}
