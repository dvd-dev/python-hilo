name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pre-commit on all files
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    runs-on: "ubuntu-latest"
    name: Tests (${{ matrix.python-version }})
    strategy:
      matrix:
        # Mirrors the Hilo integration, which still supports Home Assistant releases on 3.13.
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v
